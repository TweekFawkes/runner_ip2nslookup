runner:
  name: IP to Nslookup
  description: Queries via Nslookup for the provided IP address.
  version: 0.0.1

build:
  commands: |
    echo "START: Building the runner"
    apt update
    apt install -y dnsutils
    echo "END: Building the runner"

webform:
  - name: ip_address
    prompt: IP Address
    type: text

launch:
  type: binary
  command: nslookup ${ip_address}